[package]
name = "app"
version = "1.2.0-dev.6"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The executable is named for the product, not the package. The package stays
# `app` because three lockfile anchors in `scripts/version.py` key on it; the
# binary is what the user sees - the Dock tooltip and Activity Monitor on macOS,
# Task Manager on Windows - and it said `app`.
[[bin]]
name = "FreeDocs"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The first Rust tests in this crate. `portable_env` is pure given a root path,
# so it needs a directory tree and nothing else — everything around it needs a
# running `AppHandle`, and a test that builds one is a test of Tauri.
tempfile = "3"

