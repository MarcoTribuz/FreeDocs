name: msix-spike

# A feasibility spike, not a release path: can the Windows build ship as an
# MSIX (the Microsoft Store route that signs and updates for free)? It reuses
# an MSI app.yml already built rather than bundling again, because bundling is
# the 26-minute half of app.yml and develop's prerelease version cannot produce
# an MSI at all - WiX refuses `1.2.0-dev.N`.
#
# On a release branch: dispatch app.yml on it first, then re-run this. The MSI
# is the newest successful app.yml run on the same branch; the spike branch
# itself falls back to the v1.1.0 release build (run 38268968198).
#
# Not a release path. Replace with app/packaging/msix.py inside app.yml once
# the package has been installed on a real Windows machine.
on:
  push:
    branches: [feature/msix-spike, "release/**"]
  workflow_dispatch:

permissions:
  contents: read
  # Downloading an artifact from another run of another workflow.
  actions: read

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch the MSI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow app.yml --branch "$BRANCH" \
                  --status success -L 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            if [ "$BRANCH" = feature/msix-spike ]; then run=38268968198; else
              echo "::error::no successful app.yml run on $BRANCH - dispatch it, then re-run this"
              exit 1
            fi
          fi
          echo "MSI from app.yml run $run"
          gh run download "$run" -n freedocs-x86_64-pc-windows-msvc -D msi-in -R "$GITHUB_REPOSITORY"

      - name: Repackage as MSIX, install, smoke-test
        shell: pwsh
        run: ./app/packaging/msix_spike.ps1 -Source msi-in -Out msix-out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: msix-spike
          path: msix-out/*
          if-no-files-found: warn
          compression-level: 0
