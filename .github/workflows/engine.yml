name: engine

on:
  push:
    branches: [main]
  pull_request:

# The default token is read-write on every scope unless a workflow says
# otherwise, and nothing in this one needs to write anything. Declared at the
# workflow level so a job added later inherits the narrow set rather than the
# broad one.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Windows is here because that is where the cross-platform failures have
      # been, and because this job is the only one a pull request now runs.
      # `write_text` translating "\n" to CRLF broke three leak tests and was
      # invisible on Linux and macOS; it was caught by the bundle workflow, which
      # took twenty-six minutes to say so. One 3.12 run on Windows says the same
      # thing in about a minute. 3.10 is checked on Linux alone: it is a
      # language-floor question, not a platform one.
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        working-directory: engine
    # Every `uv` invocation in the job, not just the sync. `--python` on the sync
    # alone was silently not enough: the next step ran plain `uv run`, uv chose
    # the runner's default 3.12, found a virtualenv built for another
    # interpreter, *removed* it and made a new one with three packages in it. So
    # the 3.10 job died on `Failed to spawn: ruff` before linting anything and
    # never reached the suite at all — the declared floor in `pyproject.toml` was
    # going unchecked while the matrix said otherwise.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install
        # 'restore' is here and 'ner' is not (see the comment below): it is one
        # small wheel, and the checks it enables are not quality measurements
        # that skip harmlessly. The key file is the only artifact this tool
        # writes that could hand back every value it removed, so "no value is
        # readable in the key file" has to actually run.
        run: uv sync --locked --extra dev --extra pdf --extra ooxml --extra restore

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # The 'ner' extra is deliberately not installed here: it would pull torch
      # and download ~1.2GB of model weights on every run. The model-backed tests
      # skip themselves when it is absent, and detection quality is measured by
      # `freedocs benchmark` against the labelled corpus rather than asserted in
      # CI. What CI must protect is the machinery.
      - name: Test
        run: uv run pytest -q -m "not slow"

      # Run the leak checks on their own so a failure here is unmistakable in
      # the log. This is the suite that decides whether the tool is usable.
      - name: Leak checks
        run: uv run pytest -q -m "leak and not slow"

      # The corpus is gold data: bad offsets would make every future benchmark
      # number meaningless, so its consistency is checked on every push.
      - name: Corpus integrity
        run: uv run pytest -q tests/test_corpus.py

      # The audit `scripts/ci.py check` runs, here so that re-enabling this
      # workflow does not lose it. Two things about the shape.
      #
      # One matrix entry, not three. An advisory is a property of the locked
      # dependency set, not of the interpreter or the platform, so the other two
      # would spend minutes to print the same answer.
      #
      # The **lockfile**, not the installed environment. The install step above
      # deliberately omits the `ner` extra, so an environment audit would skip
      # torch — by a distance the largest dependency here and the one an advisory
      # is most likely to name. `--all-extras` covers what a release ships.
      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv export --format requirements-txt --no-hashes --all-extras \
            --no-emit-project -o .audit-requirements.txt
          # One excused advisory, with its reason and its version guard, in
          # EXCUSED_ADVISORIES in scripts/ci.py. The flag is repeated here
          # without the guard, so on re-enabling CI move to calling that list.
          # The lock takes torch from the PyTorch CPU index on Linux, and the
          # advisory databases know `torch 2.14.1` but not `2.14.1+cpu`, so
          # `--strict` refuses the line as unauditable. The local version
          # label names a build, not a release: the source is the same, and it
          # is the version the macOS line of the same export already pins.
          sed -i 's/^\(torch==[^+ ]*\)+cpu /\1 /' .audit-requirements.txt
          uv run --with pip-audit pip-audit --strict \
            --ignore-vuln PYSEC-2026-3804 -r .audit-requirements.txt
