name: engine

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Windows is here because that is where the cross-platform failures have
      # been, and because this job is the only one a pull request now runs.
      # `write_text` translating "\n" to CRLF broke three leak tests and was
      # invisible on Linux and macOS; it was caught by the bundle workflow, which
      # took twenty-six minutes to say so. One 3.12 run on Windows says the same
      # thing in about a minute. 3.10 is checked on Linux alone: it is a
      # language-floor question, not a platform one.
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        working-directory: engine
    # Every `uv` invocation in the job, not just the sync. `--python` on the sync
    # alone was silently not enough: the next step ran plain `uv run`, uv chose
    # the runner's default 3.12, found a virtualenv built for another
    # interpreter, *removed* it and made a new one with three packages in it. So
    # the 3.10 job died on `Failed to spawn: ruff` before linting anything and
    # never reached the suite at all — the declared floor in `pyproject.toml` was
    # going unchecked while the matrix said otherwise.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra pdf --extra ooxml

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # The 'ner' extra is deliberately not installed here: it would pull torch
      # and download ~1.2GB of model weights on every run. The model-backed tests
      # skip themselves when it is absent, and detection quality is measured by
      # `freedocs benchmark` against the labelled corpus rather than asserted in
      # CI. What CI must protect is the machinery.
      - name: Test
        run: uv run pytest -q -m "not slow"

      # Run the leak checks on their own so a failure here is unmistakable in
      # the log. This is the suite that decides whether the tool is usable.
      - name: Leak checks
        run: uv run pytest -q -m "leak and not slow"

      # The corpus is gold data: bad offsets would make every future benchmark
      # number meaningless, so its consistency is checked on every push.
      - name: Corpus integrity
        run: uv run pytest -q tests/test_corpus.py
