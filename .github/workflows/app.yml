name: app

# Not on pull requests, and not on a branch push. Bundling costs 8 minutes on
# macOS, 13 on Linux and 26 on Windows, it runs three times over, and it was
# doing so on every push to every open branch — nine runs in one morning, most
# of them re-running an unchanged bundle because a review comment moved. The
# engine workflow is what a pull request needs: it is thirty seconds and it now
# covers Windows, which is where the cross-platform bugs have actually been.
#
# What this gives up, stated: a change that breaks packaging is found when it
# lands on main rather than before. That is a minute after the merge, on a
# private repository with one developer, and `workflow_dispatch` is there for
# anyone who wants the bundle before merging.
#
# No `paths` filter. It would be right for the branch trigger and wrong for the
# tag one: a release tag points at a commit whose diff may touch nothing under
# `app/`, and the filter would skip the build that makes the release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# PyInstaller does not cross-compile and neither does Tauri, so each platform
# builds its own artefact on its own runner. This matrix is the only place the
# multi-platform claim is actually tested: the Linux and Windows halves have never
# been built on a developer's Mac.
#
# Intel macOS is not in the matrix, and that is a gap rather than a decision
# about who to support. `macos-13` was retired: the job sat queued for fifty
# minutes with no runner ever assigned, which reads exactly like a slow build and
# is not one. The Intel replacement, `macos-15-intel`, is a larger runner and
# therefore billed, and this repository is private. Cross-compiling from the
# arm64 runner would cover the Rust half and not the sidecar, which is the half
# PyInstaller cannot cross-compile — so an Intel bundle needs an Intel machine,
# paid for or self-hosted. Until there is one, x86_64 macOS is untested rather
# than quietly built from the wrong architecture.
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 rather than macos-14: the latter still works and is marked
          # deprecated, which is the state macos-13 was in before it stopped
          # being assigned a runner at all.
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    # Linux ships a .deb and not an AppImage. The AppImage step is what failed:
    # `FreeDocs_0.1.0_amd64.deb` bundles fine and the run then dies on
    # `failed to run linuxdeploy` with no diagnostic of its own, after nine
    # minutes. This is a scope reduction, not a fix — nobody here has an
    # AppImage to test — so it is stated rather than hidden, and the artifact
    # list below still names the other formats for the platforms that make them.
    env:
      BUNDLES: ${{ matrix.runner == 'ubuntu-22.04' && '--bundles deb' || '' }}
    steps:
      - uses: actions/checkout@v7

      # Tauri needs the system webview and its build dependencies. macOS and
      # Windows ship one; Linux does not.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            tesseract-ocr

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the engine
        working-directory: engine
        run: uv sync --extra dev --extra pdf --extra ooxml --extra ner

      # The engine's own tests gate the bundle: shipping an app around a broken
      # engine wastes everyone's time downloading it.
      - name: Test the engine
        working-directory: engine
        run: uv run pytest -q -m "not slow"

      - name: Build the engine sidecar
        working-directory: engine
        run: uv run --with pyinstaller python packaging/build.py

      - name: Install the frontend
        working-directory: app
        run: npm ci

      - name: Type-check the frontend
        working-directory: app
        run: npm run check

      # The offset arithmetic behind the review pane. Node only, no browser: the
      # things a browser would tell us are the things this suite deliberately
      # does not claim to cover.
      - name: Test the frontend
        working-directory: app
        run: npm test

      # No Apple signing variables here, and their absence is the fix. An unset
      # secret does not arrive as an absent environment variable — it arrives as
      # a *set and empty* one, `APPLE_CERTIFICATE:` with nothing after it, which
      # `tauri build` reads as "sign this". Both macOS jobs spent five minutes
      # bundling and then died in `security: SecKeychainItemImport: One or more
      # parameters passed to a function were not valid`. The old comment here
      # claimed an unsigned build would still be produced; it never was.
      #
      # This repository has no secrets at all (`gh api .../actions/secrets` ->
      # `total_count: 0`), so signing has nothing to do yet. Restoring it means
      # adding the certificate *and* these variables together, in that order.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }} ${{ env.BUNDLES }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: true

      - uses: actions/upload-artifact@v7
        with:
          name: freedocs-${{ matrix.target }}
          path: |
            app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: warn
