[project]
name = "freedocs"
version = "0.1.0"
description = "Local, offline removal of confidential data from documents before they reach an LLM"
# No `readme` key: the project README lives at the repository root, outside this
# package directory, and duplicating it here would leave two copies to drift.
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }

# M0 keeps the dependency set to what the L1 validator layer actually needs.
# The NER model, PDF and OOXML stacks arrive with their own milestones so that
# a broken optional dependency can never take down the core pipeline.
dependencies = [
    "python-stdnum>=1.19",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
pdf = [
    "pymupdf>=1.24",
]
ooxml = ["lxml>=5.0"]
# gliner2, not gliner: the privacy-filter model is a GLiNER2 checkpoint from
# fastino-ai and the two packages are not interchangeable. Roughly 1.2 GB of
# model is fetched to the Hugging Face cache on first use, never bundled.
ner = ["gliner2>=1.3", "torch>=2.2"]
# The lightweight alternative, kept installable so the benchmark comparison
# stays reproducible. It lost on measured numbers; see the M2 table in README.
ner-presidio = ["presidio-analyzer>=2.2", "spacy>=3.7"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # Test-only, and never used by the engine: it produces a realistic OOXML
    # package to validate the handler against, so the tests are not only checking
    # our own hand-built XML back at us. It is also the reader used to confirm
    # the scrubbed file still opens.
    "python-docx>=1.1",
]

[project.scripts]
freedocs = "freedocs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freedocs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "leak: end-to-end check that no canary value survives a scrub",
    "fidelity: check that document structure is preserved byte-for-byte where it should be",
    "slow: loads a real NER model; downloads ~1.2GB on first run",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# OOXML content-type and namespace URIs are long and must stay on one line to
# remain greppable against the spec. Wrapping them would be worse than the lint.
"tests/docx_builder.py" = ["E501"]
