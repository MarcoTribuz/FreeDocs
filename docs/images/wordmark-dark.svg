<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 56" width="272" height="56" role="img" aria-label="FreeDocs">
  <!-- Dark-theme wordmark. Same geometry as wordmark-light.svg; only the fills
       change, and they are the app's dark tokens (app/src/app.css). A white
       label on the light accent measures 2.40:1 in dark mode, which is why the
       dark palette is a different green rather than the same one dimmed. -->
  <rect x="7" y="5" width="34" height="46" rx="5" fill="none" stroke="#3fbb92" stroke-width="3"/>
  <rect x="14" y="14" width="20" height="3" rx="1.5" fill="#2a4c41"/>
  <rect x="14" y="22" width="20" height="7" rx="1.5" fill="#3fbb92"/>
  <rect x="14" y="34" width="20" height="3" rx="1.5" fill="#2a4c41"/>
  <rect x="14" y="41" width="13" height="3" rx="1.5" fill="#2a4c41"/>
  <text x="55" y="39" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8">
    <tspan fill="#e9efec">Free</tspan><tspan fill="#3fbb92">Docs</tspan>
  </text>
</svg>
