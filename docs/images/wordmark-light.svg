<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 56" width="272" height="56" role="img" aria-label="FreeDocs">
  <!-- Light-theme wordmark. Presentation attributes only, no <style> block:
       GitHub sanitises embedded CSS out of an SVG served in a README.
       Colours are the app's own tokens (app/src/app.css) so the repository and
       the window cannot disagree about what the brand green is. -->
  <rect x="7" y="5" width="34" height="46" rx="5" fill="none" stroke="#22785c" stroke-width="3"/>
  <rect x="14" y="14" width="20" height="3" rx="1.5" fill="#b9e0d0"/>
  <rect x="14" y="22" width="20" height="7" rx="1.5" fill="#22785c"/>
  <rect x="14" y="34" width="20" height="3" rx="1.5" fill="#b9e0d0"/>
  <rect x="14" y="41" width="13" height="3" rx="1.5" fill="#b9e0d0"/>
  <text x="55" y="39" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8">
    <tspan fill="#12211c">Free</tspan><tspan fill="#1f6f54">Docs</tspan>
  </text>
</svg>
